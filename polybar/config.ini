;; Minimal polybar config - DWM style

[bar/main]
width = 100%
height = 24
bottom = false
override-redirect = true
wm-restack = dwm
layer = top
background = #1a1b26
foreground = #c0caf5

padding = 3

font-0 = "monospace:size=10"
font-1 = "DejaVu Sans Mono:size=9"
font-2 = "Noto Color Emoji:size=7"

modules-left = workspaces
modules-center = title
modules-right = cpu memory battery wifi ip date

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/dwm-workspaces.sh
interval = 1
format = <label>
format-foreground = #7aa2f7
format-background = #1a1b26

[module/title]
type = internal/xwindow
format = <label>
format-foreground = #a9b1d6
label = "%title%"
label-maxlen = 50

[module/cpu]
type = custom/script
exec = ~/.config/polybar/scripts/cpu.sh
interval = 5
format = <label>
format-foreground = #ffffff
format-background = #ff5555
format-padding = 1

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/memory.sh
interval = 5
format = <label>
format-foreground = #ffffff
format-background = #2d5a27
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT1
full-at = 99

format-charging = <label-charging>
format-charging-background = #8be9fd
format-charging-foreground = #282a36
format-charging-padding = 1
format-discharging = <label-discharging>
format-discharging-background = #f1fa8c
format-discharging-foreground = #282a36
format-discharging-padding = 1
format-full = <label-full>
format-full-background = #bd93f9
format-full-foreground = #282a36
format-full-padding = 1

label-charging = "⚡ %percentage%%"
label-discharging = "⌁ %percentage%%"
label-full = "★ %percentage%%"

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 10
format = <label>
format-foreground = #ffffff
format-background = #6272a4
format-padding = 1
click-left = nm-connection-editor

[module/ip]
type = custom/script
exec = ~/.config/polybar/scripts/ip.sh
interval = 30
format = <label>
format-foreground = #ffffff
format-background = #6272a4
format-padding = 1

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/date.sh
interval = 1
format = <label>
format-foreground = #282a36
format-background = #ff79c6
format-padding = 1