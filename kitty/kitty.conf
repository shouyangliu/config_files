# 字体配置
font_family      ComicsShannsMono Nerd Font Mono

# fcitx5 输入法支持
env GTK_IM_MODULE,fcitx5
env QT_IM_MODULE,fcitx5
env XMODIFIERS,@im=fcitx5
enable_x11_input_method yes
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# 窗口外观
hide_window_decorations yes
background_opacity 0.92
dynamic_background_opacity no

# Tab 栏
tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 2
tab_switch_delay 0

# 颜色方案 (Dracula)
foreground #f8f8f2
background #282a36
cursor #f8f8f2

# 黑色
color0  #21222c
color8  #6272a4

# 红色
color1  #ff5555
color9  #ff6e6e

# 绿色
color2  #50fa7b
color10 #69ff94

# 黄色
color3  #f1fa8c
color11 #ffffa5

# 蓝色
color4  #bd93f9
color12 #d6acff

# 粉红
color5  #ff79c6
color13 #ff92df

# 青色
color6  #8be9fd
color14 #a4ffff

# 白色
color7  #f8f8f2
color15 #ffffff

# 光标配置
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# 滚动
scrollback_lines 10000

# 快捷键 (Ctrl+s 为前缀)
# 新建标签页
map ctrl+s c new_tab
# 关闭标签页
map ctrl+s w close_tab
# 上下分屏
map ctrl+s - split_window --vertical
# 左右分屏
map ctrl+s / split_window --horizontal

# 切换 pane
map ctrl+s h goto_layout parent; goto_window -1
map ctrl+s j goto_window down
map ctrl+s k goto_window up
map ctrl+s l goto_layout next; goto_window 1

# 调整 pane 大小
map ctrl+s ctrl+h resize_window shrink_by 5
map ctrl+s ctrl+j resize_window grow_by 5
map ctrl+s ctrl+k resize_window shrink_by 5
map ctrl+s ctrl+l resize_window grow_by 5

# 标签页切换
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+s n next_tab
map ctrl+s p previous_tab

# 重新加载配置
map ctrl+shift+r load_config_file

# 鼠标点击链接
mouse_map left click grab_linked

# 复制粘贴
map ctrl+s v paste_from_clipboard
map ctrl+s y copy_to_clipboard

# 终端提示音
enable_audio_bell no
