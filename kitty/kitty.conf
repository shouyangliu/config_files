font_family ComicsShannsMono Nerd Font Mono
font_size 12

background_opacity 0.9
hide_window_decorations yes

# 快捷键与 Wezterm 一致 (Ctrl+s 为前缀)
# 新建标签页
map ctrl+s c new_tab
# 关闭标签页
map ctrl+s w close_tab
# 上下分屏
map ctrl+s - split_window --vertical
# 左右分屏
map ctrl+s / split_window --horizontal

# 切换 pane
map ctrl+s h goto_layout parent; goto_window -1
map ctrl+s j goto_window down
map ctrl+s k goto_window up
map ctrl+s l goto_layout next; goto_window 1

# 调整 pane 大小
map ctrl+s ctrl+h resize_window shrink_by 5
map ctrl+s ctrl+j resize_window grow_by 5
map ctrl+s ctrl+k resize_window shrink_by 5
map ctrl+s ctrl+l resize_window grow_by 5

# 标签页切换
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+s n next_tab
map ctrl+s p previous_tab

# 重新加载配置
map ctrl+shift+r load_config_file

# 鼠标点击链接
mouse_map left click grab_linked

# 美化
tab_bar_edge top
tab_bar_style powerline
