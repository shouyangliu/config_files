# 修改进入命令模式按键
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# 鼠标支持
set -g mouse on
set-option -g default-shell "/usr/bin/fish"

# 使用 vi 模式进行复制
setw -g mode-keys vi
# 绑定鼠标拖拽复制到系统剪切板（使用 xclip）
# 启用 tmux 内部剪贴板
set-option -s set-clipboard on

# 使用鼠标拖拽复制到系统剪贴板
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# 使用 y 键复制到系统剪贴板
# 这里使用 'y' 键，并将其绑定到 'copy-pipe'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# 基础设置
set -g default-terminal "screen-256color"
set -g display-time 3000
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0

# 窗口和面板操作
# 按 Ctrl + s 然后按 - 或 / 分割窗口，更符合视觉习惯
unbind %
bind / split-window -h # 水平分割
unbind '"'
bind - split-window -v # 垂直分割

# 使用 hjkl 键在面板间移动
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整面板大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 重新加载配置
unbind r
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# 状态栏配置
set -g status-justify centre
set -g status-right '[#(whoami) #(date +" %m-%d %H:%M ")]'
set -g status-right-length 120
set -g status-interval 1
set -g visual-activity on
setw -g monitor-activity on
setw -g automatic-rename off

set -g status-justify "centre"
set -g window-status-format '#I #W'
set -g window-status-current-format ' #I #W '

# 面板编号颜色
set -g display-panes-active-colour colour33 # blue
set -g display-panes-colour colour166 # orange

# 时钟颜色
setw -g clock-mode-colour colour64 # green
